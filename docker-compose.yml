version: '3.8'

services:
  # Definimos nuestro servicio de base de datos
  db:
    image: postgres:15
    container_name: proyecto_correcta
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

# Definimos un volumen para que los datos no se borren al apagar el contenedor
volumes:
  db_data: