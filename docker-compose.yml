version: '3.8'

services:
  # Definimos nuestro servicio de base de datos
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cats_db
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

# Definimos un volumen para que los datos no se borren al apagar el contenedor
volumes:
  db_data: